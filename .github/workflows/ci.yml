name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MERCH_PROVIDER_MODE: fake
      MERCH_PUBLISH_MODE: dry_run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync --extra dev --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-mono fonts-roboto-slab librsvg2-bin
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: RUN_TEMPORAL_TESTS=1 uv run pytest -m temporal
      - run: uv build
      - run: MERCH_ENV_FILE=.env.example docker compose config --quiet

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_PLAYWRIGHT: "1"
      MERCH_PROVIDER_MODE: fake
      MERCH_PUBLISH_MODE: dry_run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync --extra dev --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-mono fonts-roboto-slab librsvg2-bin
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m playwright
