[project]
name = "merch"
version = "0.1.0"
description = "Autonomous, approval-gated print-on-demand product pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16.0",
  "argon2-cffi>=25.1.0",
  "boto3>=1.40.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "openai>=2.8.0",
  "opentelemetry-exporter-otlp-proto-http>=1.37.0",
  "opentelemetry-instrumentation-fastapi>=0.58b0",
  "opentelemetry-instrumentation-httpx>=0.58b0",
  "opentelemetry-sdk>=1.37.0",
  "pillow>=11.3.0",
  "prometheus-client>=0.22.0",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "structlog>=25.4.0",
  "temporalio[pydantic]>=1.18.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "pytest-playwright>=0.7.0",
  "respx>=0.22.0",
  "playwright>=1.55.0",
  "ruff>=0.12.0",
]

[project.scripts]
merch = "merch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merch"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/tools/compose_kiln_weather_redesign.py",
]
only-include = [
  ".dockerignore",
  ".env.example",
  ".github",
  ".gitignore",
  ".python-version",
  "CONTRIBUTING.md",
  "Dockerfile",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "alembic",
  "alembic.ini",
  "docker",
  "docker-compose.yml",
  "main.py",
  "pyproject.toml",
  "src",
  "tests",
  "tools",
  "uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "playwright: browser-backed integration test",
  "temporal: Temporal time-skipping integration test",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
